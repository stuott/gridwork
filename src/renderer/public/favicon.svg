<!-- Gridwork mark. Standalone asset: browsers render the favicon outside the
     document, so the theme tokens in style.css can't reach it and the two
     colours below have to be literals. They're the cool-light --ink and
     --paper values, which read acceptably on both light and dark tab strips.
     Source and alternates: assets/brand/. -->
